name: Build MYRA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Real Project APK
        run: |
          # चेक करें कि gradlew कहाँ पर है और सही फोल्डर में जाएं
          if [ -f "gradlew" ]; then
            PROJECT_DIR="."
          elif [ -f "MYRA-AI/gradlew" ]; then
            PROJECT_DIR="MYRA-AI"
          else
            # अगर gradlew नहीं मिला, तो नया रैपर जनरेट कर लेंगे
            PROJECT_DIR="."
            gradle wrapper --gradle-version 8.4
          fi

          cd $PROJECT_DIR

          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myra-apk
          path: |
            **/build/outputs/apk/debug/*.apk
