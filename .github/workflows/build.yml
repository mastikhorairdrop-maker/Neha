name: Build Real MYRA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Actual MYRA Project
        run: |
          # अगर प्रोजेक्ट MYRA-AI फोल्डर के अंदर है, तो उसमें जाएं
          if [ -d "MYRA-AI" ]; then
            cd MYRA-AI
          fi

          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          # अगर gradlew नहीं है तो रैपर बनाएं, वरना सीधे बिल्ड करें
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.4
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myra-real-apk
          path: |
            **/build/outputs/apk/debug/*.apk
